<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAPJcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <title>Resume Analyzer</title>
</head>

<body class="bg-light" style="display: flex; justify-content: center; align-items: center; height: 60vh;">
    <div class="row">
        <div class="card shadow" style="width: 60rem;">
            <div class="card-header">
                <h1>Resume Analyzer</h1>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="resume" class="form-label">Upload Resume</label>
                    <span class="form-text d-none" id="resumeError" style="color: red;">Please select a resume file to
                        upload.</span>
                    <input type="file" class="form-control" id="resume" placeholder="Choose your resume" accept=".pdf"
                        onchange="hideError(event)">
                </div>

                <div class="mb-3">
                    <label for="job_description" class="form-label">Job Description</label>
                    <span class="form-text d-none" id="jobDescriptionError" style="color: red;">Please enter a job
                        description.</span>
                    <textarea class="form-control" id="job_description" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <button type="button" class="btn btn-primary" onclick="submitForm()">Submit</button>
                    <button type="button" class="btn btn-danger" onclick="resetForm()">Reset</button>
                </div>
            </div>
        </div>
        <div class="card shadow" style="width: 20rem; margin-left: 20px;">
            <div class="card-header bg-success text-white">
                <h1>Result</h1>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <div id="analysisResult">

                    </div>
                </div>
            </div>
        </div>

        <script>


            async function submitForm() {
                const resumeInput = document.getElementById("resume");
                const jobDescriptionInput = document.getElementById("job_description");

                const resumeFile = resumeInput.files[0];
                const jobDescription = jobDescriptionInput.value;
                const formData = new FormData();
                formData.append("resume", resumeFile);
                formData.append("job_description", jobDescription);

                var isValid = true;

                if (!resumeFile) {
                    document.getElementById("resumeError").classList.remove("d-none");
                    isValid = false;
                }

                if (!jobDescription) {
                    document.getElementById("jobDescriptionError").classList.remove("d-none");
                    isValid = false;
                }

                if (!isValid) {
                    return;
                }

                try {
                    const response = await fetch(
                        "/analyze", {
                        method: "POST",
                        body: formData
                    }
                    )
                    const result = await response.json();
                    display_result(result);

                    console.log("Analysis Result:", result);
                }
                catch (error) {
                    console.error("Analysis Failed", error);
                    return;

                }
            }

            function display_result(result) {
                const resultDiv = document.getElementById("analysisResult");
                resultDiv.replaceChildren();
                const table = document.createElement("table");
                table.classList.add("table", "table-sm", "table-success");
                for (const [key,value] of Object.entries(result)) {
                    const row = table.insertRow();
                    row.insertCell().textContent = key;
                    const valueCell = row.insertCell();
                    if (Array.isArray(value)) {
                        const list = document.createElement("ul");
                        list.classList.add("list-inline", "mb-0");

                        value.forEach((item) => {
                            const listItem = document.createElement("li");
                            listItem.classList.add("list-inline-item");
                            listItem.textContent = item;
                            list.appendChild(listItem);
                        });
                        valueCell.appendChild(list);
                    } else {
                        valueCell.textContent = value;
                    }
                }
                resultDiv.appendChild(table);
            }

            function resetForm() {
                const resumeInput = document.getElementById("resume");
                const jobDescriptionInput = document.getElementById("job_description");

                resumeInput.value = "";
                jobDescriptionInput.value = "";

                document.getElementById("resumeError").classList.add("d-none");
                document.getElementById("jobDescriptionError").classList.add("d-none");
            }

            function hideError(event) {
                const resumeError = document.getElementById("resumeError");
                if (event.target.files.length > 0) {
                    resumeError.classList.add("d-none");
                }
            }

        </script>
</body>

</html>
