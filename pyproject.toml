[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-analyzer"
version = "0.1.0"
description = "Analyze resume skills against a job description."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pymupdf",
    "pydantic",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resume_analyzer = ["views/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

